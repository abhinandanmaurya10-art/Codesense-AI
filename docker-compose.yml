version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile 
    container_name: codesense-backend
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - NODE_ENV=development
      - PORT=5001
    env_file:
      - backend/.env.production
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - codesense-network

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=/api
        - NITRO_PRESET=node-server
    container_name: codesense-frontend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - codesense-network

  frontend-proxy:
    image: nginx:alpine
    container_name: codesense-frontend-proxy
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - codesense-network

  # MongoDB
  mongo:
    image: mongo:7-alpine
    container_name: codesense-mongo
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=codesense-ai
    ports:
      - "127.0.0.1:27017:27017"
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codesense-network

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local

networks:
  codesense-network:
    driver: bridge
